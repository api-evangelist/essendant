note: >-
  Essendant publishes no developer portal, but two of its identity hosts serve real,
  parsing OpenID Connect discovery documents from an AD FS deployment. They sit at the
  AD FS-rooted path /adfs/.well-known/openid-configuration; the server root
  /.well-known/openid-configuration returns 503 on both hosts. These documents are the
  SSO surface behind Essendant's reseller/customer portals (Solutions Central, Azerty,
  BiggestBook, Empower Central) — they are NOT a public API authorization server, and
  no client can self-register against them. Recorded because they are genuinely
  published, machine-readable and anonymously fetchable, not because they constitute a
  developer program.
