name: Essendant
aid: essendant
description: 'Essendant is a national wholesale distributor and third-party logistics provider of workplace
  products — business and office supplies, furniture, janitorial and breakroom (JanSan), foodservice,
  industrial and automotive aftermarket items — operating a network of 35+ distribution centers carrying
  49,000+ SKUs. Built on the United Stationers, Lagasse Sweet and Azerty brands and owned by Staples since
  2019, it sells through independent resellers rather than direct to end users, and its Connected Commerce
  and Fulfillment Services arms add marketplace access, retail drop-ship, B2C fulfillment and Amazon SFP/FBA
  prep. Its integration surface is trading-partner EDI and the ECDB product-content feed rather than a
  public API: no developer portal, OpenAPI, MCP server or agent card is published on any Essendant host.'
